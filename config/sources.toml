# Fonti del digest.
#
# [[google_news]]: ricerca su Google News (copre Il Sole 24 Ore, MF, Reuters, Bloomberg, BeBeez, ecc.).
#   q     = query (sintassi Google: OR, "frase esatta", site:dominio)
#   lang  = "it" (Google News Italia) oppure "en" (Google News UK)
#   topic = etichetta interna, aiuta Claude a capire da dove arriva la notizia
#
# [[rss]]: feed RSS diretti (es. newsletter con feed pubblico). url + topic.
#
# Per aggiungere una fonte basta copiare un blocco e cambiare i valori.
#
# [filters]: preferred_sources = testate da privilegiare; blocked_sources = testate scartate prima di Claude
#   (basta una parte del nome, maiuscole/minuscole indifferenti).

[filters]
preferred_sources = ["BeBeez", "FinanceCommunity", "Milano Finanza", "MF", "Il Sole 24 Ore", "Reuters", "Bloomberg",
  "Financial Times", "Les Echos", "9fin", "Debtwire", "Private Equity International", "Private Equity Wire",
  "Unquote", "Mergermarket", "PitchBook", "Corriere della Sera", "Teleborsa", "Radiocor"]
blocked_sources = ["BigGo", "Traders Union", "tmgm", "Mott Capital", "lavx", "Tech Times", "DirettaCalcioMercato",
  "Sbircia la Notizia", "The Flight Club", "MarketBeat", "Benzinga", "Yahoo", "AInvest", "StocksToTrade",
  "Calciomercato", "Tuttomercatoweb", "Seeking Alpha", "Motley Fool", "TipRanks", "GuruFocus", "Simply Wall St"]
# titoli scartati se contengono una di queste parole (filing automatici, rumore)
blocked_title_words = ["Form 4", "Form 13D", "Form 13G", "Form 8-K", "Form 10-Q", "Form 144", "SEC Filing"]

[[rss]]
url = "https://www.bebeez.it/feed/"
source = "BeBeez"
topic = "BeBeez (feed diretto)"

