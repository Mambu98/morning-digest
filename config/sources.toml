# Fonti del digest.
#
# [[google_news]]: ricerca su Google News (copre Il Sole 24 Ore, MF, Reuters, Bloomberg, BeBeez, ecc.).
#   q     = query (sintassi Google: OR, "frase esatta", site:dominio)
#   lang  = "it" (Google News Italia) oppure "en" (Google News UK)
#   topic = etichetta interna, aiuta Claude a capire da dove arriva la notizia
#
# [[rss]]: feed RSS diretti (es. newsletter con feed pubblico). url + topic.
#
# Per aggiungere una fonte basta copiare un blocco e cambiare i valori.

[[google_news]]
q = '"private equity" acquisizione OR rileva OR maggioranza'
lang = "it"
topic = "PE Italia"

[[google_news]]
q = 'LBO OR "leveraged buyout" OR buyout fondo'
lang = "it"
topic = "LBO Italia"

[[google_news]]
q = 'unitranche OR "direct lending" OR "private debt" OR "finanziamento" fondo acquisizione'
lang = "it"
topic = "Debt financing Italia"

